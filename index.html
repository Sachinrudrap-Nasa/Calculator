<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calculator</title>
		<link rel="icon" type="image/jpg" href="NASA.jpg">
		<link rel="stylesheet" href="index.css">
	</head>
	<body>
		<div id="display">
			<div id="variablesdisplay">
				<p id="numbera" class="variabletext"></p>
				<p id="operator" class="variabletext"></p>
				<p id="numberb" class="variabletext"></p>
			</div>
			<div id="answerdisplay">
				<p id="displaytext">0</p>
			</div>
		</div>
		<div id="calcbox" class="buttons">
			<button
				id="leftparenthesis"
				onclick="getButtonVal(this.textContent.trim())"
			>
				(
			</button>
			<button
				id="rightparenthesis"
				onclick="getButtonVal(this.textContent.trim())"
			>
				)
			</button>
			<button id="clear" onclick="getButtonVal(this.textContent.trim())">
				C
			</button>
			<button id="backspace" onclick="getButtonVal(this.textContent.trim())">
				bs
			</button>
			<button id="num7" onclick="getButtonVal(this.textContent.trim())">
				7
			</button>
			<button id="num8" onclick="getButtonVal(this.textContent.trim())">
				8
			</button>
			<button id="num9" onclick="getButtonVal(this.textContent.trim())">
				9
			</button>
			<button id="divide" onclick="getButtonVal(this.textContent.trim())">
				/
			</button>
			<button id="num4" onclick="getButtonVal(this.textContent.trim())">
				4
			</button>
			<button id="num5" onclick="getButtonVal(this.textContent.trim())">
				5
			</button>
			<button id="num6" onclick="getButtonVal(this.textContent.trim())">
				6
			</button>
			<button id="multiply" onclick="getButtonVal(this.textContent.trim())">
				*
			</button>
			<button id="num1" onclick="getButtonVal(this.textContent.trim())">
				1
			</button>
			<button id="num2" onclick="getButtonVal(this.textContent.trim())">
				2
			</button>
			<button id="num3" onclick="getButtonVal(this.textContent.trim())">
				3
			</button>
			<button id="subtract" onclick="getButtonVal(this.textContent.trim())">
				-
			</button>
			<button id="num0" onclick="getButtonVal(this.textContent.trim())">
				0
			</button>
			<button id="decimal" onclick="getButtonVal(this.textContent.trim())">
				.
			</button>
			<button id="equals" onclick="getButtonVal(this.textContent.trim())">
				=
			</button>
			<button id="add" onclick="getButtonVal(this.textContent.trim())">
				+
			</button>
		</div>
		<script src="index.js"></script>
	</body>
</html>
